# Helpers required by the card and automations (add to configuration.yaml or create in the UI
# with the same entity IDs).  卡片與自動化需要的輔助實體。
input_number:
  cooker_prog_step:       # multi-step program: current step
    name: Cooker program step
    min: 0
    max: 20
    step: 1
    mode: box
  cooker_prog_total:      # multi-step program: number of steps
    name: Cooker program steps
    min: 0
    max: 20
    step: 1
    mode: box
input_boolean:
  cooker_slot5_pending:
    name: Cooker custom slot pending
    icon: mdi:clock-outline
input_datetime:
  cooker_prog_end:        # end of the current program step
    name: Cooker program step end
    has_date: true
    has_time: true
    icon: mdi:clock-end
input_text:
  cooker_slot5:
    name: Cooker custom slot recipe name
    max: 20
    icon: mdi:pot-steam
