# Optional automations for the Xiaomi Mijia mini rice cooker (chunmi.cooker.tw1): names the 'Custom' slot button.
# 米家電子鍋選用自動化：替「自選」按鈕命名。Entity IDs assume the device's HA entities are named
# sensor.chunmi_tw1_c3d7_* / button.chunmi_tw1_c3d7_cancel_cooking; replace 'c3d7' with your device's suffix.
- id: cooker_slot5
  alias: 電鍋：記錄自選格食譜
  description: 從 HA 啟動自選（參數5）後，等 menu 重新回報，依尾碼記下食譜名稱
  triggers:
  - trigger: state
    entity_id: sensor.chunmi_tw1_c3d7_cooker
    to: busy
  conditions:
  - condition: state
    entity_id: input_boolean.cooker_slot5_pending
    state: 'on'
  actions:
  - delay: 00:00:45
  - if:
    - condition: template
      value_template: '{% set m = {''06'':''優格'',''07'':''嬰兒粥'',''08'':''泡麵'',''09'':''蛋糕'',''0a'':''煲湯'',''0b'':''再加熱'',''0c'':''關東煮'',''0d'':''熱米飯'',''0e'':''香甜煮'',''0f'':''極速煮'',''05'':''燉煮''}
        %}{{ (states(''sensor.chunmi_tw1_c3d7_menu'') | replace(''"'',''''))[-2:]
        in m }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.cooker_slot5
      data:
        value: '{% set m = {''06'':''優格'',''07'':''嬰兒粥'',''08'':''泡麵'',''09'':''蛋糕'',''0a'':''煲湯'',''0b'':''再加熱'',''0c'':''關東煮'',''0d'':''熱米飯'',''0e'':''香甜煮'',''0f'':''極速煮'',''05'':''燉煮''}
          %}{{ m[(states(''sensor.chunmi_tw1_c3d7_menu'') | replace(''"'',''''))[-2:]]
          }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cooker_slot5_pending
  mode: single
- id: cooker_slot5_expire
  alias: 電鍋：自選格待辨識逾時
  description: 待辨識旗標開著超過 3 分鐘沒被用到就關掉，避免之後誤記
  triggers:
  - trigger: state
    entity_id: input_boolean.cooker_slot5_pending
    to: 'on'
    for: 00:03:00
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.cooker_slot5_pending
  mode: single
- id: cooker_prog_reset
  alias: 電鍋：HA 啟動時清除程式進度
  description: HA 重新啟動後，多段程式不會繼續，清掉卡片上殘留的段數與目標溫度
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: input_number.set_value
    target:
      entity_id:
      - input_number.cooker_prog_step
      - input_number.cooker_prog_target
    data:
      value: 0
  mode: single
# 以下兩條：逾時保險與完成通知。把 notify.persistent_notification 換成你的手機，例如 notify.mobile_app_xxx
- id: cooker_watchdog
  alias: 電鍋：舒肥逾時保險
  description: 舒肥的預計結束時間過了 5 分鐘電鍋還在煮，就取消並通知（電鍋偶爾時間到不會自己停）
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: sensor.chunmi_tw1_c3d7_cooker
    state: busy
  - condition: numeric_state
    entity_id: input_number.cooker_prog_target
    above: 0
  - condition: state
    entity_id: script.cooker_program
    state: 'off'
  - condition: template
    value_template: '{% set e = as_timestamp(states(''input_datetime.cooker_prog_end''),
      0) %}{{ e > 1700000000 and as_timestamp(now()) > e + 300 }}'
  actions:
  - action: button.press
    target:
      entity_id: button.chunmi_tw1_c3d7_cancel_cooking
  - action: input_number.set_value
    target:
      entity_id: input_number.cooker_prog_target
    data:
      value: 0
  - action: notify.persistent_notification
    data:
      title: 電鍋
      message: 舒肥時間到了電鍋沒有自己停，已自動取消
  mode: single
- id: cooker_done_notify
  alias: 電鍋：舒肥完成通知
  description: 單段舒肥結束（電鍋回到待機）時通知；多段程式由腳本自己通知
  triggers:
  - trigger: state
    entity_id: sensor.chunmi_tw1_c3d7_cooker
    from: busy
    to: idle
  conditions:
  - condition: numeric_state
    entity_id: input_number.cooker_prog_target
    above: 0
  - condition: state
    entity_id: script.cooker_program
    state: 'off'
  actions:
  - action: notify.persistent_notification
    data:
      title: 電鍋
      message: 舒肥結束，電鍋已停止
  - action: input_number.set_value
    target:
      entity_id: input_number.cooker_prog_target
    data:
      value: 0
  mode: single
